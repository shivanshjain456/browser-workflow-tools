# Keeps the pinned development toolchain (and the SHA-pinned workflows) fresh
# without noisy daily PRs. The userscript itself has no runtime dependencies, so
# nothing here can affect what users install.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    versioning-strategy: increase
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-toolchain:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
