name: Feature request
description: Propose a capability or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the workflow you are trying to complete. Features that need new
        permissions, a new runtime dependency, or a new storage key face a high
        bar in this project — say up front if your idea needs one.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The real task, and where the current script gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
      description: Settings, presets, batch options, keyboard chords, or another tool.
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Does your proposal need any of these?
      multiple: true
      options:
        - A new @grant or a wider permission
        - A new network destination
        - A new persistent storage key
        - A new runtime dependency (the artifact must stay one self-contained file)
        - A new setting or UI section
        - None of the above
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots of other tools, sample pages, or format specifications.
    validations:
      required: false
