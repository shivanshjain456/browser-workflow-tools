name: Bug report
description: Something in the script does not work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in the environment block — most bugs
        here turn out to be manager/permission or page-policy related, and the
        Diagnostics output usually identifies them immediately.
  - type: input
    id: script-version
    attributes:
      label: Script version
      description: Shown in the manager dashboard next to "Save Image as Type".
      placeholder: "2.0.1"
    validations:
      required: true
  - type: input
    id: manager
    attributes:
      label: Userscript manager and version
      placeholder: "Violentmonkey 2.49.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 155.0.8059.79 on Windows 11"
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: How did you install it?
      options:
        - From release/save-image-as-type.user.js (repository file or download)
        - From a raw GitHub link
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Mention the image type (img/picture/background/SVG) and whether the page needs a login.
      placeholder: |
        1. Open a page with a animated WebP image
        2. Right-click it, choose Save image as… → GIF
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: Include the exact toast text if one appeared, and whether the menu opened at all.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics output
      description: |
        Manager popup → "Save Image as Type — settings" → Diagnostics, or the
        Diagnostics command in the menu. Redact anything private.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked docs/troubleshooting.md.
          required: true
        - label: I am not reporting a security issue (those go through SECURITY.md).
          required: true
        - label: The browser's "Allow User Scripts" switch is enabled for my manager.
          required: false
