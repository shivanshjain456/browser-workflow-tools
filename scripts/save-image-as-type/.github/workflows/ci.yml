# Continuous integration: static checks, unit tests, browser scenarios and a
# clean artifact build. No secrets are used: pull requests are untrusted input,
# so this job is read-only and touches nothing private.
#
# Actions are pinned to immutable commit SHAs (the release line they belong to
# is in the trailing comment). Update deliberately, one action at a time.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: npm
      - name: Install Python decoder dependencies
        run: python3 -m pip install --user -r audit/requirements.txt
      - name: Install dependencies (exact lockfile)
        run: npm ci
      - name: Prerequisites present
        run: node audit/preflight.mjs
      - name: Static checks
        run: npm run lint
      - name: Release gates (version, metadata, docs, checksums)
        run: npm run verify:release
      - name: Artifact is not stale
        run: npm run build:check
      - name: Unit and contract tests
        run: npm test
      - name: Browser scenarios
        run: npm run test:browser
      - name: Independent encoder/decoder checks
        run: node audit/independent-goldens.mjs
      - name: Upload report on failure
        if: failure()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: failure-report
          path: |
            .tmp-browser/report.json
            audit/evidence/pipeline-*.txt
          if-no-files-found: ignore
          retention-days: 7
