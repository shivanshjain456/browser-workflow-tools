# Publishes release assets for a tag that already has a GitHub Release.
#
# Deliberately triggered by an explicit `workflow_dispatch` naming the tag,
# rather than by pushing a tag: pulling events never reach fork PRs, and the run
# cannot be started by an untrusted pull request. Publishing a Release is a
# manual maintainer action (docs/release-process.md).
name: Release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v2.0.1); a GitHub Release must already exist for it"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Re-verify and attach assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: npm
      - name: Install Python decoder dependencies
        run: python3 -m pip install --user -r audit/requirements.txt
      - name: Install dependencies (exact lockfile)
        run: npm ci
      - name: Gate the exact tag contents
        run: |
          node audit/preflight.mjs
          npm run lint
          npm run verify:release
          npm run build:check
          npm test
          npm run test:browser
      - name: Rebuild the source capsule and checksums
        run: python3 audit/make-package.py
      - name: Assemble release assets
        run: |
          mkdir -p dist
          cp release/save-image-as-type.user.js dist/
          cp release/save-image-as-type-*-source.zip dist/
          ( cd dist && sha256sum save-image-as-type.user.js *-source.zip > SHA256SUMS )
          cat dist/SHA256SUMS
      - name: Attach assets to the existing Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/* --clobber
